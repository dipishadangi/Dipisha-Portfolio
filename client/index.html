<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8ed" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <title>Dipisha Chhetri — Frontend Developer &amp; Visual Designer</title>
    <meta
      name="description"
      content="Portfolio of Dipisha Chhetri: frontend development, visual design and SEO work from Nepal."
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Set before first paint so nothing animates for a frame and then stops.
         The site animates by default; the footer switch overrides it. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.motion =
            localStorage.getItem('dipisha-motion') === 'off' ? 'off' : 'on';
        } catch (e) {
          document.documentElement.dataset.motion = 'on';
        }
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
